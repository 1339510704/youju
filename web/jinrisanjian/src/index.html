<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日三件 · 说说你的近况，排出该做的事</title>
<style>
:root{
  --bg:#F7F9FC; --card:#FFFFFF; --ink:#18202E; --ink2:#5B6B84; --ink3:#93A2B8; --line:#E5EBF4;
  --blue:#3B6EF5; --blue2:#6C93FF; --sky:#E8F0FF;
  --green:#12A66A; --green-bg:#E9F8F1; --amber:#B45309; --amber-bg:#FFF7E6; --red:#E5484D; --red-bg:#FDECEC;
  --sans:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","SimSun",serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --r:16px;
  --sh:0 2px 8px rgba(24,32,46,.04),0 10px 30px rgba(24,32,46,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 70px}
/* 顶栏 */
header{display:flex;align-items:center;gap:12px;padding:20px 0 12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,var(--blue2),var(--blue));display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(59,110,245,.3)}
.logo .nm{font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo .nm span{color:var(--blue)}
header .sp{flex:1}
.pill{font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;box-shadow:var(--sh);display:inline-flex;align-items:center;gap:6px}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pill.ok{color:var(--green)}.pill.ok .d{background:var(--green)}
/* Hero */
.hero{padding:30px 0 20px}
.hero .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--blue);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.8vw,50px);font-weight:700;line-height:1.2;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--blue);position:relative}
.hero p{margin-top:14px;font-size:15px;color:var(--ink2);max-width:620px;line-height:1.85}
.hero p b{color:var(--ink);font-weight:700}
/* 输入卡 */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:20px 22px}
.card h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card h2 .i{color:var(--blue)}
.card h2 .h{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink3)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-family:var(--sans);font-size:14px;line-height:1.85;color:var(--ink);resize:vertical;min-height:110px;outline:none;background:#FBFCFE;transition:.15s}
textarea:focus{border-color:var(--blue2);background:#fff;box-shadow:0 0 0 4px rgba(59,110,245,.1)}
textarea::placeholder{color:#A7B4C7}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:.15s;font-family:var(--sans)}
.chip:hover{border-color:var(--blue2);color:var(--blue);background:var(--sky)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 26px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;transition:.15s;font-family:var(--sans);box-shadow:0 6px 16px rgba(59,110,245,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(59,110,245,.32)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none;font-weight:700}
.btn.ghost:hover{border-color:var(--blue2);color:var(--blue);transform:none}
.hint{font-size:11.5px;color:var(--ink3)}
/* 结果 */
.result{margin-top:24px;display:none}
.result.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rh h2{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.01em}
.rh .sub{font-size:12.5px;color:var(--ink2);margin-top:4px}
.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11.5px;font-weight:700;border-radius:99px;padding:5px 12px;background:var(--sky);color:var(--blue)}
.badge.demo{background:var(--amber-bg);color:var(--amber)}
/* 分组 */
.grp{margin-top:22px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.grp-h .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--blue);background:var(--sky);padding:3px 10px;border-radius:99px}
.grp-h .l{flex:1;height:1px;background:var(--line)}
.grp-h .c{font-size:11px;color:var(--ink3)}
/* 待办卡 */
.todo{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:10px;transition:.18s;position:relative;overflow:hidden}
.todo:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(24,32,46,.09)}
.todo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.todo.hi::before{background:var(--red)}
.todo.md::before{background:var(--amber)}
.todo.lo::before{background:var(--green)}
.td-top{display:flex;align-items:flex-start;gap:10px}
.td-n{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink3);padding-top:3px;min-width:18px}
.td-bd{flex:1;min-width:0}
.td-tx{font-size:15.5px;font-weight:800;line-height:1.45;letter-spacing:-.01em}
.td-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.td-tag{font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:#F1F5FC;color:var(--ink2)}
.td-tag.hi{background:var(--red-bg);color:var(--red)}
.td-tag.md{background:var(--amber-bg);color:var(--amber)}
.td-tag.lo{background:var(--green-bg);color:var(--green)}
.td-why{font-size:12.5px;color:var(--ink2);line-height:1.75;margin-top:9px}
.td-why b{color:var(--ink)}
.td-adv{margin-top:9px;font-size:12.5px;line-height:1.75;background:var(--sky);border-radius:9px;padding:9px 12px;color:var(--ink)}
.td-adv .lb{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--blue);display:block;margin-bottom:3px;font-family:var(--mono)}
/* 引用依据 */
.cites{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.cites-h{font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;color:var(--ink3);margin-bottom:7px}
.cite{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.65;padding:6px 0}
.cite .sq{flex:none;width:3px;border-radius:2px;background:var(--blue2);align-self:stretch;min-height:16px}
.cite .ct{flex:1;min-width:0}
.cite .ct a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line)}
.cite .ct a:hover{color:var(--blue);border-color:var(--blue2)}
.cite .sn{display:block;color:var(--ink2);margin-top:2px;font-size:11.5px}
.cite .src{flex:none;font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap;padding-top:2px}
/* 侧栏 */
.side{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:20px}
@media(max-width:760px){.side{grid-template-columns:1fr}}
.mini{background:#fff;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:16px 18px}
.mini h3{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.mini h3 .i{color:var(--blue)}
.mini ul{list-style:none;display:grid;gap:7px}
.mini li{font-size:12.5px;color:var(--ink2);display:flex;gap:8px;line-height:1.6}
.mini li::before{content:"›";color:var(--blue);font-weight:800;flex:none}
.mini li b{color:var(--ink);font-weight:700}
.mini li a{color:var(--blue);text-decoration:none}
.mini li a:hover{text-decoration:underline}
.mini.warn{background:var(--amber-bg);border-color:#F5E0B7}
.mini.warn h3 .i{color:var(--amber)}
.mini.warn li{color:#7A5A16}
.mini.warn li::before{color:var(--amber)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:46px 20px;text-align:center;color:#A7B4C7;font-size:13px}
.foot{text-align:center;font-size:11.5px;color:#A7B4C7;margin-top:34px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><div class="ic">☀</div><div class="nm">今日<span>三件</span></div></div>
    <div class="sp"></div>
    <div class="pill" id="stagePill"><span class="d"></span><span id="stageTxt">界面预览版</span></div>
  </header>

  <section class="hero">
    <div class="kicker">说说你的近况，别自己列待办</div>
    <h1>你只说要往哪走<br>我们把<em>该做的事</em>排出来</h1>
    <p>
      想备孕、想考研、想结婚——你知道目标，但不确定<strong>先做什么</strong>。
      这里按你的情况和公开信息，排出<b>可落地、可执行</b>的清单：
      每件事都写清<b>为什么现在做</b>、<b>具体怎么做</b>，并附上<b>引用依据</b>，能点开原文核对。
    </p>
  </section>

  <div class="card">
    <h2><span class="i">✎</span>你最近在考虑什么<span class="h">越具体，排得越准</span></h2>
    <textarea id="situation" placeholder="例：最近在考虑备孕，但不知道该提前多久开始准备，也不知道要查哪些项目。我今年 30 岁，平时上班久坐，作息不太规律。"></textarea>
    <div class="chips" id="chips">
      <button class="chip" data-k="beiyun">备孕</button>
      <button class="chip" data-k="kaoyan">考研</button>
      <button class="chip" data-k="jiehun">结婚</button>
      <button class="chip" data-k="huanzhu">换工作</button>
      <button class="chip" data-k="tijian">体检</button>
    </div>
    <div class="btnrow">
      <button class="btn" id="go">生成我该做的事</button>
      <button class="btn ghost" id="demo">看个例子</button>
      <span class="hint">点上面的标签可快速填入示例</span>
    </div>
  </div>

  <div class="result" id="result"></div>

  <div class="foot">
    今日三件 · 让"该做什么"有据可查，而不是靠感觉<br>
    建议仅供参考，医疗、法律、教育相关政策请以官方最新发布为准
  </div>
</div>

<script>

/* ---------- 快速标签 ---------- */
const FILL={
  beiyun:'最近在考虑备孕，但不知道该提前多久开始准备、要查哪些项目。我今年 30 岁，上班久坐，作息不太规律。',
  kaoyan:'想考研，但还没定院校和专业，也不知道该从哪一步开始准备。我是在职备考，每天能挤出 2 小时。',
  jiehun:'准备结婚了，但对流程完全没概念：登记要带什么、要不要婚检、婚礼从哪开始筹备。',
  huanzhu:'想换工作，但不确定该先改简历还是先看机会。现在这份做了 3 年，想往管理方向走。',
  tijian:'想认真做一次体检，但不知道按我这个年龄该查哪些项目，也不想被推销一堆用不上的。'
};
document.querySelectorAll('#chips .chip').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    $('#situation').value=FILL[b.dataset.k]||'';
    $('#situation').focus();
  };
});

/* ---------- 判断话题 ---------- */
function detect(text){
  if(/备孕|要孩子|怀孕|生育|叶酸/.test(text)) return 'beiyun';
  if(/考研|研究生|读研|考试|备考/.test(text)) return 'kaoyan';
  if(/结婚|婚礼|领证|婚检|嫁|娶/.test(text)) return 'jiehun';
  return 'default';
}

/* ---------- 渲染 ---------- */
function render(key,userText){
  const d=DATA[key]||DATA.default;
  const total=d.groups.reduce((a,g)=>a+g.items.length,0);
  const srcCount=d.groups.reduce((a,g)=>a+g.items.reduce((b,it)=>b+(it.cites?it.cites.length:0),0),0);

  $('#result').innerHTML=`
    <div class="rh">
      <div>
        <h2>${esc(d.headline)}</h2>
        <div class="sub">按「${esc(d.label)}」这个情况，共 ${total} 件事，分成 ${d.groups.length} 个阶段</div>
      </div>
      <div class="badges">
        <span class="badge">${total} 件事 · ${srcCount} 条依据</span>
        <span class="badge demo">示例数据 · 检索接入中</span>
      </div>
    </div>

    ${d.groups.map(g=>`
      <div class="grp">
        <div class="grp-h">
          <span class="t">${esc(g.t)}</span>
          <span class="l"></span>
          <span class="c">${esc(g.c)}</span>
        </div>
        ${g.items.map((it,i)=>`
          <div class="todo ${it.p||'lo'}">
            <div class="td-top">
              <div class="td-n">${String(i+1).padStart(2,'0')}</div>
              <div class="td-bd">
                <div class="td-tx">${esc(it.title)}</div>
                <div class="td-tags">
                  ${(it.tags||[]).map(t=>`<span class="td-tag ${it.p||'lo'}">${esc(t)}</span>`).join('')}
                </div>
                <div class="td-why"><b>为什么现在做：</b>${esc(it.why)}</div>
                <div class="td-adv"><span class="lb">怎么做</span>${esc(it.adv)}</div>
                ${(it.cites&&it.cites.length)?`
                  <div class="cites">
                    <div class="cites-h">引用依据</div>
                    ${it.cites.map(c=>`
                      <div class="cite">
                        <div class="sq"></div>
                        <div class="ct">
                          <a href="${esc(c.u)}" target="_blank" rel="noopener noreferrer">${esc(c.t)}</a>
                          <span class="sn">${esc(c.s)}</span>
                        </div>
                        <div class="src">${esc(c.d)}</div>
                      </div>`).join('')}
                  </div>`:''}
              </div>
            </div>
          </div>`).join('')}
      </div>`).join('')}

    <div class="side">
      <div class="mini">
        <h3><span class="i">▤</span>依据来源（${(d.sources||[]).length}）</h3>
        <ul>
          ${(d.sources||[]).map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">${esc(s.t)}</a> <b>${esc(s.d)}</b></li>`).join('')}
        </ul>
      </div>
      <div class="mini warn">
        <h3><span class="i">!</span>边界提醒</h3>
        <ul>${(d.warns||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
      </div>
    </div>
  `;
  $('#result').classList.add('on');
  $('#stagePill').className='pill';
  $('#stageTxt').textContent='已生成 · 示例数据';
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 事件 ---------- */
$('#go').onclick=()=>{
  const t=$('#situation').value.trim();
  if(!t){ $('#situation').focus(); return; }
  render(detect(t),t);
};
$('#demo').onclick=()=>{
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('on'));
  const first=document.querySelector('#chips .chip[data-k="beiyun"]');
  if(first) first.classList.add('on');
  $('#situation').value=FILL.beiyun;
  render('beiyun',FILL.beiyun);
};
</script>
