<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 侦探社 · 事实核查与证据链</title>
<style>
:root{
  --ink:#111827; --ink2:#4B5563; --ink3:#9CA3AF;
  --paper:#F7F5EF; --card:#FFFFFF; --line:#E5E1D8;
  --teal:#0F766E; --teal-bg:#ECFDF5;
  --blue:#1D4ED8; --amber:#B45309; --amber-bg:#FFFBEB;
  --red:#991B1B; --red-bg:#FEF2F2;
  --green:#15803D;
  --sans:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","SimSun",serif;
  --mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
.top{border-bottom:1px solid var(--line);background:rgba(247,245,239,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
.top-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:16px}
.brand .nm{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.04em}
.brand .sub{font-size:11px;color:var(--ink3);letter-spacing:.08em}
.top .sp{flex:1}
.pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.pill.ok{color:var(--teal);border-color:#BBF7D0;background:var(--teal-bg)}
.pill.ok .d{background:var(--teal);box-shadow:0 0 7px rgba(15,118,110,.6)}
.pill.bad{color:var(--red);border-color:#FECACA;background:var(--red-bg)}
.pill.bad .d{background:var(--red)}
.tbtn{font-size:12px;font-weight:700;padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--sans)}
.tbtn:hover{border-color:var(--ink3);color:var(--ink)}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px 70px}
.hero{padding:34px 0 18px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
.hero h1{font-family:var(--serif);font-size:clamp(34px,4.6vw,52px);font-weight:700;line-height:1.12;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{margin-top:8px;font-size:14px;color:var(--ink2);max-width:560px}
.hero .stats{display:flex;gap:20px}
.hero .stats div{text-align:right}
.hero .stats .v{font-family:var(--mono);font-size:22px;font-weight:700}
.hero .stats .k{font-size:11px;color:var(--ink3)}
.query{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 12px 32px rgba(17,24,39,.05)}
.query textarea{width:100%;border:0;outline:0;resize:none;font-family:var(--sans);font-size:16px;font-weight:600;line-height:1.6;color:var(--ink);min-height:52px;background:transparent}
.query textarea::placeholder{color:var(--ink3);font-weight:400}
.qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qbar-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.qbar-sub-lbl{font-size:10.5px;color:var(--ink3);margin-right:2px;white-space:nowrap}
.seg{display:flex;background:var(--paper);border-radius:9px;padding:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:var(--sans)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12)}
.qbar .sp{flex:1}
.scene-sel{font-family:var(--sans);font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;color:var(--ink2);cursor:pointer;outline:none}
.eng-tog{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer}
.eng-tog input{accent-color:var(--teal);cursor:pointer}
.eng-badge{font-family:var(--mono);font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:3px;background:#E0F2FE;color:#0369A1}
.scene-sel:focus{border-color:var(--teal)}
.hint{font-size:11.5px;color:var(--ink3)}
.go{padding:10px 24px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--sans);transition:.15s}
.go:hover{background:#000;transform:translateY(-1px)}
.go:disabled{background:var(--ink3);cursor:wait;transform:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;margin-top:18px;align-items:start}
@media(max-width:1080px){.grid{grid-template-columns:1fr}}
.progress{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 16px;margin-bottom:14px;display:none}
.progress.on{display:block}
.progress .ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);margin-bottom:8px}
.step{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12px;color:var(--ink3)}
.step .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:8px;flex:none}
.step.run{color:var(--amber)} .step.run .dot{border-color:var(--amber);background:var(--amber);color:#fff}
.step.done{color:var(--ink2)} .step.done .dot{border-color:var(--green);background:var(--green);color:#fff}
.verdict{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:14px}
.vh{padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vh.g{background:var(--teal-bg);border-bottom:1px solid #BBF7D0}
.vh.a{background:var(--amber-bg);border-bottom:1px solid #FDE68A}
.vh.r{background:var(--red-bg);border-bottom:1px solid #FECACA}
.vh .tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px;color:#fff}
.vh.g .tag{background:var(--teal)} .vh.a .tag{background:var(--amber)} .vh.r .tag{background:var(--red)}
.vh .tx{font-size:16px;font-weight:800;letter-spacing:-.01em}
.vh .meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.vb{padding:12px 18px;font-size:13px;color:var(--ink2);line-height:1.75}
.ans-sum{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:10px}
.ans-li{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:.14s;background:#fff}
.ans-li:hover{border-color:#CBD5E1;background:#FAFAF9}
.ans-li.on{border-color:var(--teal);background:var(--teal-bg)}
.ans-n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--teal);flex:none;margin-top:2px}
.ans-tx{flex:1;font-size:13px;line-height:1.7}
.ans-tx mark{background:#FDE68A;padding:0 2px;border-radius:2px;font-weight:700}
.ans-src{font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap;margin-top:3px}
.ans-ent{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ans-ent-l{font-size:11px;color:var(--ink3);margin-right:4px}
.ent{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--teal-bg);color:var(--teal);border:1px solid #BBF7D0}
.xv-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);margin-bottom:10px}
.xv-legend span{display:inline-flex;align-items:center;gap:5px}
.xv-legend .dot{width:7px;height:7px;border-radius:50%;display:block}
.xv-legend .dot.ok{background:var(--green)} .xv-legend .dot.warn{background:var(--amber)} .xv-legend .dot.bad{background:var(--red)}
.xv-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.xv-row.ok{border-color:#BBF7D0;background:#F6FDF9}
.xv-row .xv-t{flex:1;font-weight:700}
.xv-row .xv-n{font-family:var(--mono);font-size:10.5px;color:var(--teal);background:var(--teal-bg);padding:1px 8px;border-radius:99px}
.xv-row .xv-bad{font-size:10px;font-weight:700;color:var(--red);background:var(--red-bg);padding:1px 8px;border-radius:99px}
.tip-line{font-size:11px;color:var(--ink3);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.viz-top{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center;margin-bottom:14px}
@media(max-width:640px){.viz-top{grid-template-columns:1fr}}
.cf-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.cf-num{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1}
.cf-num.g{color:var(--green)} .cf-num.a{color:var(--amber)} .cf-num.r{color:var(--red)}
.cf-lbl{font-size:12px;font-weight:800;color:var(--ink2)}
.cf-dim{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:11.5px}
.cf-dim span{width:76px;color:var(--ink3);flex:none}
.cf-dim i{flex:1;height:7px;background:#F0EDE6;border-radius:99px;overflow:hidden}
.cf-dim i b{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.cf-dim em{font-family:var(--mono);font-size:10px;color:var(--ink3);width:24px;text-align:right;font-style:normal}
.radar-box{border:1px solid var(--line);border-radius:12px;padding:6px;background:#FAFAF9}
.cloud-wrap{border:1px solid var(--line);border-radius:12px;background:#FAFAF9;padding:6px;margin-bottom:12px}
.cloud-wrap canvas{display:block;width:100%}
.tb-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:11.5px}
.tb-row .tb-n{width:60px;font-weight:800;flex:none}
.tb-row .tb-bar{flex:1;height:8px;background:#F0EDE6;border-radius:99px;overflow:hidden}
.tb-row .tb-bar i{display:block;height:100%;border-radius:99px}
.tb-row .tb-v{font-family:var(--mono);font-size:10px;color:var(--ink3);width:64px;text-align:right}
.ans-panel{border:2px solid var(--teal);background:linear-gradient(180deg,#F2FDF9 0%,#FFFFFF 120px);box-shadow:0 4px 18px rgba(15,118,110,.1);padding:18px 20px}
.ans-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ans-badge{font-size:15px;font-weight:900;letter-spacing:.08em;color:#fff;background:var(--teal);padding:5px 14px;border-radius:8px}
.ans-tag{font-size:11px;color:var(--teal);background:var(--teal-bg);padding:2px 9px;border-radius:99px}
.ans-meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.ans-main{border:1.5px solid #BBF7D0;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:.15s}
.ans-main:hover{border-color:var(--teal);box-shadow:0 6px 20px rgba(15,118,110,.12)}
.ans-main-tx{font-size:16.5px;line-height:1.85;font-weight:600;color:var(--ink)}
.ans-main-tx mark{background:#FDE68A;padding:0 3px;border-radius:3px;font-weight:800}
.ans-main-src{margin-top:10px;font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.ans-main-src span{font-size:10.5px;color:var(--teal);opacity:.8}
.ans-none{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.8;margin-bottom:10px}
.cl-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.cl-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;margin-top:2px;color:#fff}
.cl-badge.ok{background:var(--teal)} .cl-badge.warn{background:var(--amber)} .cl-badge.no{background:var(--red)}
.cl-tx{flex:1;font-size:12.5px;line-height:1.65;color:var(--ink)}
.cl-row.sum{background:#FAFAF9;border-color:#D6D3D1}
.cl-row.sum .cl-tx{font-weight:800;font-size:12.5px}
.cl-meta{font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap;margin-top:3px}
.falsify-row{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;flex-wrap:wrap}
.falsify-btn{padding:7px 16px;border:1.5px solid var(--red);border-radius:8px;background:#fff;color:var(--red);font-size:12px;font-weight:800;cursor:pointer;font-family:var(--sans);transition:.15s}
.falsify-btn:hover{background:var(--red-bg)}
.falsify-row span{font-size:11px;color:var(--ink3)}
.falsify-h{font-size:11.5px;font-weight:800;color:var(--red);margin:8px 0 6px}
.falsify-item{border:1px solid #FECACA;background:#FEF7F7;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.fi-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.fi-top a{font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.fi-top a:hover{text-decoration:underline}
.fi-sn{font-size:11px;color:var(--ink2);line-height:1.6}
.falsify-none{font-size:11.5px;color:var(--ink3);padding:10px;background:#FAFAF9;border-radius:8px;line-height:1.7}
.ans-det{margin-top:6px}
.ans-det summary{cursor:pointer;font-size:11.5px;color:var(--ink3);padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
.ans-det summary::-webkit-details-marker{display:none}
.ans-det summary::before{content:"▸";font-size:9px;transition:.2s}
.ans-det[open] summary::before{transform:rotate(90deg)}
.ans-det summary span{font-size:10px;opacity:.6}
.ans-cats{margin-bottom:12px;display:grid;gap:7px}
.ans-cat{display:flex;gap:9px;align-items:flex-start}
.ans-cat-n{flex:none;width:104px;font-size:11px;color:var(--ink3);padding-top:3px;text-align:right}
.ans-cat-i{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.conflict-h{font-size:11.5px;font-weight:800;color:var(--amber);margin:12px 0 8px;padding-top:10px;border-top:1px dashed var(--line)}
.conflict-box{border:1px solid #FDE68A;background:#FFFDF5;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cf-term{font-size:13px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.cf-term span{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink3)}
.cf-side{font-size:11.5px;line-height:1.7;padding:6px 9px;border-radius:6px;margin-bottom:5px;color:var(--ink2)}
.cf-side b{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:99px;margin-right:7px;color:#fff}
.cf-side.yes{background:#F0FDF4}.cf-side.yes b{background:var(--green)}
.cf-side.no{background:#FEF2F2;margin-bottom:0}.cf-side.no b{background:var(--red)}
.cf-side .cf-src{font-size:10px;color:var(--ink3);margin-left:4px}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
@media(max-width:640px){.pc-grid{grid-template-columns:1fr}}
.pc-cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FFFDF9}
.pc-cell.ok{border-color:#BBF7D0;background:#F6FDF9}
.pc-cell.warn{border-color:#FDE68A;background:#FFFDF5}
.pc-cell.bad{border-color:#FECACA;background:#FEF7F7}
.pc-cell .pc-k{font-size:11px;color:var(--ink3)}
.pc-cell .pc-v{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:2px}
.pc-cell .pc-v span{font-size:11px;color:var(--ink3);font-weight:400;margin-left:2px}
.pc-cell .pc-d{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.pc-list{border-top:1px dashed var(--line);padding-top:10px}
.pc-lh{font-size:11px;color:var(--ink3);margin-bottom:7px}
.pc-li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:11.5px}
.pc-li .pc-n{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--amber-bg);padding:1px 7px;border-radius:99px;white-space:nowrap}
.pc-li .pc-t{flex:1;color:var(--ink2);line-height:1.6}
.pc-li .pc-w{font-size:9.5px;color:var(--red);background:var(--red-bg);padding:1px 6px;border-radius:99px;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--ink)}
.panel h3 .r{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:0}
.claim{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.14s;background:#fff}
.claim:last-child{margin-bottom:0}
.claim:hover{border-color:#CBD5E1;background:#FAFAF9}
.claim.on{border-color:var(--teal);background:var(--teal-bg)}
.claim .ch{display:flex;align-items:flex-start;gap:9px}
.claim .st{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--paper);color:var(--ink2);white-space:nowrap;margin-top:1px}
.claim.on .st{background:var(--teal);color:#fff}
.claim .ct{flex:1;font-size:13px;line-height:1.7}
.claim .ct mark{background:#FDE68A;padding:0 2px;border-radius:2px}
.claim .cs{font-family:var(--mono);font-size:10px;color:var(--ink3);white-space:nowrap;margin-top:3px}
.pubq-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:.14s;font-size:12.5px;background:#fff}
.pubq-item:last-child{margin-bottom:0}
.pubq-item:hover{border-color:#CBD5E1;background:#FAFAF9}
.pubq-item .pq-t{flex:1;color:var(--ink2);line-height:1.6}
.pubq-item .pq-at{font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap}
.pubq-empty{font-size:12px;color:var(--ink3);text-align:center;padding:10px 0}
.side{position:sticky;top:64px}
.ev{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.ev-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.ev-h .t{font-size:12.5px;font-weight:800;letter-spacing:.04em}
.ev-h .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ev-h .sp{flex:1}
.filters{display:flex;gap:5px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.f{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink3);cursor:pointer}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ev-list{max-height:calc(100vh - 240px);overflow-y:auto;padding:10px}
.ev-list::-webkit-scrollbar{width:7px}
.ev-list::-webkit-scrollbar-thumb{background:#D6D3D1;border-radius:99px}
.src{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;transition:.16s;background:#fff}
.src:last-child{margin-bottom:0}
.src:hover{border-color:#CBD5E1}
.src.flash{box-shadow:0 0 0 3px rgba(15,118,110,.18);border-color:var(--teal)}

<script>
const $ = s=>document.querySelector(s);
const SRC = {
  official:{n:'官方',w:1.00,c:'#0F766E'},
  academic:{n:'学术',w:.94,c:'#1D4ED8'},
  media:{n:'主流媒体',w:.84,c:'#111827'},
  vertical:{n:'垂直媒体',w:.70,c:'#4D7C0F'},
  selfmedia:{n:'自媒体',w:.38,c:'#B45309'},
  marketing:{n:'营销号',w:.14,c:'#991B1B'}
};
const ORDER = ['official','academic','media','vertical','selfmedia','marketing'];
const S = { connected:false, mode:'quick', scene:'general', items:[], kws:[], filter:'all', history:[], rep:{}, lastRaw:'', jevConfigured:false, bocha:false, bochaOk:false, pubq:[] };

/* 去掉疑问词，得到核心检索词 */
function coreQuery(raw){
  return raw
    .replace(/[？?！!。，,、；;：:""''（）()【】]/g,' ')
    .replace(/(有哪些|是什么|有什么|是哪些|怎么|如何|为什么|是否|可以|需要|一般|主要|包括|用到|用于|关于|进行|的|吗)/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

/* ---------- 语义近似（char-bigram Jaccard，无 embedding 的替代） ---------- */
function bigrams(s){
  const t = String(s || '').replace(/[\s\p{P}]/gu, '');
  const out = new Set();
  for(let i = 0; i < t.length - 1; i++) out.add(t.slice(i, i + 2));
  return out;
}
function jaccard(a, b){
  const A = bigrams(a), B = bigrams(b);
  if(!A.size || !B.size) return 0;
  let inter = 0;
  A.forEach(x => { if(B.has(x)) inter++; });
  return inter / (A.size + B.size - inter);
}

/* 综合相似度：关键词重合 ∪ 字二元 Jaccard，取较大。
   中文同义改写用 char-bigram 往往只有 0.1~0.2，必须补关键词信号。 */
function simScore(a, b){
  const ta = String(a || '').toLowerCase();
  const tb = String(b || '').toLowerCase();
  const A = new Set(S.kws.filter(k => ta.includes(k)));
  const B = new Set(S.kws.filter(k => tb.includes(k)));
  let inter = 0;
  A.forEach(x => { if(B.has(x)) inter++; });
  const uni = new Set([...A, ...B]).size;
  const termSim = uni ? inter / uni : 0;
  return Math.max(jaccard(a, b), termSim);
}

/* ---------- 多子问拆解 ---------- */
function splitSubQuestions(raw){
  const parts = raw
    .split(/[；;]|以及|还有|另外/)
    .map(x => x.trim().replace(/[？?！!。]/g, ''))
    .filter(x => x.length >= 5);
  return parts.length > 1 ? parts.slice(0, 3) : [];
}

/* ---------- 加权多数投票（Weighted Majority Voting） ----------
   按立场分组 → 用信源权重（不是条数）投票 → 主题级结论 + 两边代表句。 */
function clusterClaims(points){
  const NEG = /(不能|不可|不要|不宜|不应|禁止|切勿|避免|有毒|中毒|危害|风险|误区|不实|谣言|会死|致命|丢弃|扔掉|并没有|没有证据|别吃)/;
  const w = t => (SRC[t] ? SRC[t].w : 0.6);
  const pos = [], neg = [];

  (points || []).forEach(p => {
    const plain = String(p.html || '').replace(/<[^>]+>/g, '').trim();
    if(plain.length < 15) return;
    if(/[？?]$/.test(plain)) return;          // 跳过问句标题
    const row = { plain, site: p.site || '', tier: p.tier || 'vertical' };
    (NEG.test(plain) ? neg : pos).push(row);
  });

  const all = [...pos, ...neg];
  if(!all.length) return [];

  const support = pos.reduce((a, x) => a + w(x.tier), 0);
  const oppose = neg.reduce((a, x) => a + w(x.tier), 0);
  const sites = new Set(all.map(x => x.site).filter(Boolean));

  // S3：跨立场语义同步（越高说明大家在讨论同一件事，而不是各说各话）
  let sim = 0, cnt = 0;
  for(let i = 0; i < all.length; i++){
    for(let j = i + 1; j < all.length; j++){
      sim += simScore(all[i].plain, all[j].plain);
      cnt++;
    }
  }
  const s3 = cnt ? sim / cnt : 1;

  let label = '混合', cls = 'warn';
  if(sites.size === 1){ label = '孤证'; cls = 'warn'; }
  else if(support > oppose * 1.5){ label = '偏肯定'; cls = 'ok'; }
  else if(oppose > support * 1.5){ label = '偏否定'; cls = 'no'; }
  else if(support > 0 && oppose > 0){ label = '两方都有'; cls = 'warn'; }

  const rows = [{
    rep: `含肯定词 ${support.toFixed(2)} / 含否定词 ${oppose.toFixed(2)} · ${sites.size} 个独立站点`,
    sites: sites.size, support, oppose, s3, label, cls, summary: true
  }];

  const pick = arr => arr.slice().sort((a, b) => w(b.tier) - w(a.tier)).slice(0, 2);
  pick(pos).forEach(x => rows.push({
    rep: x.plain.slice(0, 110), sites: 1, support: w(x.tier), oppose: 0, s3,
    label: '肯定', cls: 'ok', site: x.site
  }));
  pick(neg).forEach(x => rows.push({
    rep: x.plain.slice(0, 110), sites: 1, support: 0, oppose: w(x.tier), s3,
    label: '否定', cls: 'no', site: x.site
  }));

  return rows;
}

/* 给结果打上 tier/weight，并叠加场景内信誉 */
function decorate(items){
  items.forEach(it => {
    it.tier = classify(it);
    it.weight = SRC[it.tier].w;
    const r = S.rep[hostOf(it.url || '')];
    if(r && r.n >= 3){
      it.repScore = r.score;
      it.repN = r.n;
      it.weight = Math.max(0.05, Math.min(1, it.weight * (0.7 + 0.6 * r.score)));
    }
  });
  return items;
}

/* 判决结果回写信誉档案（fire-and-forget） */
function reportRep(items){
  try{
    const rows = items.map(it => {
      const g = gateScore(it, items);
      const host = hostOf(it.url || '');
      return host ? { host, verdict: g.verdict, sample: { url: it.url || '', title: it.title || '' } } : null;
    }).filter(Boolean);
    if(!rows.length) return;
    fetch('/api/reputation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: rows })
    }).catch(() => {});
  }catch(e){}
}

/* ---------- 场景化证据准入 ---------- */
const SCENES = {
  general:  {n:'通用',      industry:'',        wl:[], bl:[]},
  law:      {n:'法律',      industry:'gov',     wl:['court.gov.cn','npc.gov.cn','chinacourt.org','pkulaw.com','laws.gov.cn','spp.gov.cn'], bl:[]},
  finance:  {n:'金融',      industry:'finance', wl:['pbc.gov.cn','csrc.gov.cn','stats.gov.cn','cninfo.com.cn','mof.gov.cn','safe.gov.cn'], bl:[]},
  academic: {n:'学术',      industry:'acad',    wl:['arxiv.org','doi.org','acm.org','ieee.org','cnki.net','pubmed.ncbi.nlm.nih.gov','nature.com','sciencedirect.com'], bl:[]},
  news:     {n:'新闻',      industry:'news',    wl:[], bl:['baijiahao.baidu.com','sohu.com','toutiao.com']},
  steel:    {n:'工业 / 钢铁', industry:'',       wl:['miit.gov.cn','ndrc.gov.cn','gov.cn','csteelnews.com','mysteel.com'], bl:[]}
};

function hostOf(u){
  try { return new URL(u).hostname.toLowerCase(); } catch(e){ return ''; }
}

/* 分类（基础规则） */
function classifyBase(it){
  const u=(it.url||'').toLowerCase(), site=(it.site||''), p=it.passage||'';
  if(/\.gov\.cn|gov\.cn|\.mil\.cn/.test(u)) return 'official';
  if(/pubmed|ncbi|arxiv|\.edu|\.edu\.cn|cnki|wanfang|nature\.com|science\.org|springer|ieee|sciencedirect/.test(u)) return 'academic';
  if(/people\.com\.cn|xinhuanet|news\.cn\b|cctv|chinanews|gmw\.cn|bjd\.com\.cn|youth\.cn|thepaper\.cn|news\.qq\.com|qq\.com\/rain|163\.com|sina\.com\.cn|sohu\.com\/a|ifeng|chinadaily|36kr|huxiu|jiemian|caixin/.test(u)) return 'media';
  if(/toutiao|baijiahao|xiaohongshu|weibo|zhihu|bilibili|douyin|kuaishou/.test(u)){
    if(/北京日报|人民日报|新华社|央视|气象台|官方|记者/.test(p)) return 'media';
    return 'selfmedia';
  }
  if(/buy|shop|mall|chuangye|zhaoshang|加盟|代理/.test(u+site)) return 'marketing';
  return 'vertical';
}

/* 分类（叠加场景准入规则：黑名单降级、白名单升级） */
function classify(it){
  const base = classifyBase(it);
  const sc = SCENES[S.scene] || SCENES.general;
  const host = hostOf(it.url || '');
  if(host && sc.bl.some(d => host === d || host.endsWith('.' + d))) return 'marketing';
  if(host && sc.wl.some(d => host === d || host.endsWith('.' + d))){
    if(['vertical','selfmedia','marketing'].includes(base)) return 'media';
  }
  return base;
}

/* ---------- 关键词与高亮 ---------- */
const STOP=/[的了吗呢啊是在有和就都而及与或为以对从到把被让给还也很更最这那哪个我你他她它们些什如何怎么怎样]/;
function kws(q){
  const s=q.replace(/[？?！!。，,、；;：:""''（）()【】\[\]]/g,' ');
  const out=new Set();
  // 1) ASCII/数字片段：即使在中文串里也要抽出来（APS / 5G / GPT-4）
  (s.match(/[A-Za-z0-9][A-Za-z0-9.+#\-]*/g)||[]).forEach(w=>{
    if(w.length>=2) out.add(w.toLowerCase());
  });
  // 2) 中文片段：≤4 字整体保留，长串切相邻两字
  (s.match(/[\u4e00-\u9fa5]+/g)||[]).forEach(run=>{
    if(run.length <= 6) out.add(run);                    // 短词整体保留
    if(run.length >= 3){                                 // 同时切二元，避免「冷轧行业」整串匹配不上
      for(let i=0;i<run.length-1;i++) out.add(run.slice(i,i+2));
    }
  });
  // 3) 停用词与疑问词
  const NOISE=/^(哪些|什么|怎么|如何|是否|可以|需要|包括|一般|主要|相关|请问|一下|用到|用于|关于|进行|以及)$/;
  return [...out].filter(x=>x.length>=2 && !STOP.test(x) && !NOISE.test(x)).slice(0,16);
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function hl(s, ks){
  let out = esc(s);
  ks.forEach(k=>{
    if(k.length < 2) return;
    const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    out = out.replace(re, m=>'\u0001'+m+'\u0002');
  });
  return out.split('\u0001').join('<mark>').split('\u0002').join('</mark>');
}

/* 抽取式答案：直接从证据原文里挑与问题最相关的句子。
   不生成、不编造，每条都能回溯到来源。 */
function extractAnswer(query, items){
  const ks = S.kws;
  const high = items.filter(i=>['official','academic','media'].includes(i.tier));
  const pool = (high.length ? high : items).slice(0, 14);

  // 抽术语：xx算法 / xx搜索 / xx规划 / xx调度 / xx优化 / xx模型 / xx方法
  const entRe = /([\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9]{0,5}(?:算法|搜索|规划|调度|优化|模型|方法|策略))/g;
  const entDict = new Set(), entReSet = new Set();
  items.forEach(it=>{
    const t = it.passage || '';
    // 只从「命中问题关键词」的句子里抽术语，避免把不相关页面的词也抽进来
    t.split(/[\n\r。！？；]/).map(x=>x.trim().replace(/\s+/g,' ')).filter(x=>x.length>6).forEach(seg=>{
      const low = seg.toLowerCase();
      if(!ks.some(k=>low.includes(k))) return;
      knownIn(seg).forEach(t=>entDict.add(t));     // 词典精确命中
      let m, n = 0;
      entRe.lastIndex = 0;
      while((m = entRe.exec(seg)) && n < 8){
        const e = m[1]
          .replace(/^(如|例如|比如|包括|适用于|擅长|以及|和|其中|采用|使用|利用|基于|通过|主要|常见|应用|一种|各种|其他|可以|需要|广泛|结合|借助)/,'')
          .replace(/^[有的与及或]+/,'')
          .trim();
        const bad = /(的|常见|离散行业|如下|以上|具体|上述|以下|这些|那些|与|及)/.test(e)
                 || /^(就是|用来|用于|通过|可以|能够|从而|进而|包括|需要|比如|例如|什么|哪些|如何|怎么|是否|为什么)/.test(e)
                 || e.length > 10;
        if(e.length >= 3 && !bad) entReSet.add(e);
        n++;
      }
    });
  });

  // 句子打分：命中关键词数优先，其次信源权重
  const cands = [];
  pool.forEach(it=>{
    const arr = (it.passage||'').split(/[\n\r。！？；]/).map(x=>x.trim().replace(/\s+/g,' ')).filter(x=>x.length>12);
    const flat = [];
    arr.forEach(s=>{ chunk(s).forEach(c=>flat.push(c)); });
    flat.forEach(s=>{
      if(/[？?]$/.test(s)) return;                       // 问句标题
      if(s.length < 18 && !/[。；]/.test(s)) return;      // 太短的标题
      const low = s.toLowerCase();
      let hit = 0;
      ks.forEach(k=>{ if(low.includes(k)) hit++; });
      if(hit === 0) return;
      const hasEnt = [...entDict, ...entReSet].some(e=> s.includes(e));
      if(!hasEnt && hit < 2) return;                  // 过滤「只沾边一个词」的泛句
      const ENUM = /(主要有以下几种|包括|分为|主要有|以下几类|以下几种|如下|：)/;
      let score = hit*3 + it.weight*2 + (hasEnt ? 10 : 0);
      if(ENUM.test(s)) score += 3;                    // 列举句更像答案
      if(/算法/.test(s) && ENUM.test(s)) score += 2;
      cands.push({s, hit, w: it.weight, it, score});
    });
  });
  cands.sort((a,b)=> b.score - a.score );

  const points = [], seen = [];
  for(const c of cands){
    if(points.length >= 6) break;
    const norm = c.s.replace(/[\s0-9.、,，:：;；]/g,'');
    const head = norm.slice(0, 24);
    if(head.length < 10) continue;
    if(seen.some(x=> x.slice(0,14) === head.slice(0,14) || x.includes(head.slice(0,14)) || head.includes(x.slice(0,14)))) continue;
    seen.push(head);
    const cut = c.s.length > 220 ? c.s.slice(0,220)+'…' : c.s;
    points.push({
      html: hl(cut, ks),
      site: c.it.site || '',
      key: c.it.url || c.it.title,
      tier: c.it.tier
    });
  }

  // 词典词优先；正则词若包含词典词（如「线性规划算法」含「线性规划」）则丢弃
  const dictArr = [...entDict];
  let entities = dictArr.slice();
  [...entReSet].forEach(e=>{
    if(dictArr.some(d=> e.includes(d))) return;
    entities.push(e);
  });
  // 去掉被更长术语包含的短词
  entities = entities.filter(e=> !entities.some(o=> o !== e && o.includes(e)));
  entities = entities.slice(0,14);
  let summary;
  if(points.length){
    summary = `从 ${pool.length} 条可信来源中，抽出 ${points.length} 条与问题直接相关的原文。左边编号对应右侧证据链来源，点一条可定位。`;
  } else {
    summary = `本次召回内容与问题不直接相关，抽不出可采信的原文。建议换个说法，或切到「深度研究」多路召回。`;
  }
  return {points, entities, summary};
}

/* 长句再切分：超过 120 字按冒号/分号/序号拆开，避免整段列表被当成一句话 */
function chunk(s){
  const t = (s||'').trim();
  if(t.length <= 120) return [t];
  const parts = t.split(/(?<=[：:；;])|(?=\d+[.、])/).map(x=>x.trim()).filter(x=>x.length>10);
  return parts.length ? parts : [t];
}

/* APS / 运筹学常见算法词典：先精确命中标准术语，正则只兜底新词 */
const KNOWN_TERMS = [
  '混合整数线性规划','混合整数非线性规划','混合整数规划','整数规划','线性规划','非线性规划','目标规划',
  '约束规划','约束满足','约束传播','动态规划','分支定界','列生成','网络流','拉格朗日松弛',
  '启发式算法','启发式搜索','贪心算法','规则算法','优先级规则','派工规则',
  '遗传算法','禁忌搜索','模拟退火','蚁群算法','粒子群算法','进化算法',
  '变邻域搜索','大邻域搜索','元启发式算法','元启发式',
  '强化学习','机器学习','深度学习','神经网络','知识图谱','大模型'
];
function knownIn(seg){
  const hit = [];
  KNOWN_TERMS.forEach(t=>{ if(seg.includes(t)) hit.push(t); });
  // 丢掉被更长术语包含的（如「线性规划」被「混合整数线性规划」包含）
  return hit.filter(t=> !hit.some(o=> o !== t && o.includes(t)));
}

/* 按算法学分类归纳术语（规则词典，不是模型判断） */
const TERM_CATS = [
  {name:'数学规划 / 精确算法', re:/(线性规划|整数规划|约束规划|约束满足|动态规划|列生成|分支定界|网络流|MILP|\bCP\b|\bLP\b)/i},
  {name:'元启发式',           re:/(遗传算法|禁忌搜索|模拟退火|蚁群|粒子群|进化算法|元启发式|大邻域|变邻域|鱼群)/i},
  {name:'启发式 / 规则算法',   re:/(启发式|贪心|规则|优先级|派工|正排|倒排|约束传播)/i},
  {name:'AI / 学习类',        re:/(强化学习|机器学习|深度学习|神经网络|大模型|知识图谱|\bAI\b)/i}
];
function categorizeTerms(entities){
  const cats = TERM_CATS.map(c=>({name:c.name, items:[]}));
  const rest = [];
  entities.forEach(e=>{
    // 特异性优先：只归入第一个命中的类别
    let idx = -1;
    for(let i=0;i<TERM_CATS.length;i++){ if(TERM_CATS[i].re.test(e)){ idx = i; break; } }
    if(idx >= 0) cats[idx].items.push(e); else rest.push(e);
  });
  return {cats: cats.filter(c=>c.items.length), rest};
}

/* 按句子立场分组：用于「分歧报告」，不依赖术语 */
function splitStance(points){
  const NEG = /(不能|不可|不要|不宜|不应|禁止|切勿|避免|有毒|中毒|危害|风险|误区|不实|谣言|会死|致命|丢弃|扔掉|别再|并没有|没有证据)/;
  const POS = /(可以|能够|建议|适量|少量|没问题|安全|有效|允许|可行|继续食用|可以吃)/;
  const yes = [], no = [];
  (points||[]).forEach(p=>{
    const plain = String(p.html||'').replace(/<[^>]+>/g,'');
    const n = NEG.test(plain), y = POS.test(plain);
    if(n && !y) no.push(p);
    else if(y && !n) yes.push(p);
  });
  return {yes, no};
}

/* ---------- 非补偿性乘法门（VG-RAG 思路） ----------
   五个维度相乘，任一维度归零则整体归零。
   目的：防止「高相关性」把 SEO 农场 / 营销号救回来。 */
const HYPE_RE = /(震惊|必看|史上最|独家揭秘|稳赚不赔|包治|根治|彻底解决|颠覆|重磅|速看|限时抢|免费领取|错过再等|绝密|内幕)/;

function corroboration(it, items){
  const text = (it.passage || '').slice(0, 400).toLowerCase();
  if(!text) return 0.3;
  const terms = S.kws.filter(k => text.includes(k));
  if(!terms.length) return 0.3;
  const need = Math.min(2, terms.length);
  let sites = 0;
  items.forEach(x => {
    if(x === it) return;
    const t = (x.passage || '').toLowerCase();
    let hit = 0;
    for(const k of terms){ if(t.includes(k)) hit++; }
    if(hit >= need) sites++;
  });
  return sites >= 3 ? 1 : sites === 2 ? 0.75 : sites === 1 ? 0.5 : 0.25;
}

function gateScore(it, items){
  const host = hostOf(it.url || '');
  const dims = {};

  // ① 场景权威（信源层级权重）
  dims.auth = it.weight;

  // ② 时效匹配
  //    旧实现只匹配到「年-月」，且 180 天内一律给满分 —— 于是问「今天天气」时
  //    半年前的旧闻时效分和今天一样，全都能进答案。这是"全是历史数据"的直接原因。
  //    现在直接用后端算好的 ageDays，按天分档；时间敏感型问题严格卡今天。
  const TIME_SENS = /(最新|最近|今年|本月|本周|今天|今日|现在|当前|实时|刚刚|昨天|昨日|新闻|价格|股价|行情|天气|发布|上线|新规|政策)/;
  const strictTime = TIME_SENS.test(S.lastRaw || '');
  const age = (typeof it.ageDays === 'number') ? it.ageDays : null;
  let f;
  if (age === null) {
    f = strictTime ? 0.4 : 0.6;               // 没有可信时间，时间敏感问题不给高分
  } else if (strictTime) {
    f = age <= 0 ? 1.0
      : age === 1 ? 0.85
      : age <= 3 ? 0.5
      : age <= 7 ? 0.22
      : 0.06;                                  // 一周以上，时间敏感问题基本排除
  } else {
    f = age <= 30 ? 1.0
      : age <= 180 ? 0.75
      : age <= 730 ? 0.45
      : 0.3;
  }
  dims.fresh = f;

  // ③ 商业意图（营销号 / 夸张用语）
  let c = 1;
  if(it.tier === 'marketing') c = 0.1;
  else if(HYPE_RE.test(it.passage || '')) c = 0.3;
  dims.commercial = c;

  // ④ 佐证一致（同关键词被几个独立站点提到）
  dims.corroborate = corroboration(it, items);

  // ⑤ 来源独立性（同站点重复出现则打折）
  const sameSite = host ? items.filter(x => hostOf(x.url || '') === host).length : 0;
  dims.independent = sameSite <= 2 ? 1 : sameSite <= 4 ? 0.6 : 0.3;

  const gate = Object.values(dims).reduce((a, b) => a * b, 1);
  const pass = Object.values(dims).every(v => v >= 0.3);
  let verdict = '采信', cls = 'ok';
  if(!pass){ verdict = '排除'; cls = 'no'; }
  else if(gate < 0.25){ verdict = '降级'; cls = 'warn'; }

  return { dims, gate, pass, verdict, cls };
}

/* ---------- 污染检测：同文转载 / 夸张用语 / 域名集中度 ---------- */
function pollutionCheck(items){
  // 同文句子聚类（去空白与标点后取前 30 字）
  const sentMap = new Map();
  items.forEach(it=>{
    const clean = (it.passage||'').replace(/\s+/g,' ');
    const arr = clean.split(/(?<=[。！？；])/).map(x=>x.trim()).filter(x=>x.length>20);
    arr.forEach(s=>{
      const norm = s.replace(/[\s\p{P}]/gu,'').slice(0, 30);
      if(norm.length < 12) return;
      if(!sentMap.has(norm)) sentMap.set(norm, {text:s, sites:new Set(), tiers:new Set()});
      const v = sentMap.get(norm);
      v.sites.add(it.site || it.url || '');
      v.tiers.add(it.tier);
    });
  });
  const dup = [...sentMap.values()]
    .filter(x=>x.sites.size >= 2)
    .map(x=>({text:x.text, n:x.sites.size, onlyLow:[...x.tiers].every(t=>['selfmedia','marketing'].includes(t))}))
    .sort((a,b)=>b.n-a.n)
    .slice(0, 5);

  // 夸张用语
  const HYPE = /(震惊|必看|史上最|独家揭秘|惊呆|不转不是|稳赚不赔|包治|根治|彻底解决|颠覆|重磅|速看|限时抢|免费领取|错过再等|绝密|内幕)/;
  let hypeN = 0; const hypeSamples = [];
  items.forEach(it=>{
    const t = it.passage || '';
    const m = t.match(HYPE);
    if(m){
      hypeN++;
      if(hypeSamples.length < 3) hypeSamples.push({site:it.site||'', word:m[0], snip:t.slice(0,44)});
    }
  });

  // 域名集中度
  const domCount = new Map();
  items.forEach(it=>{ const d = it.site || it.url || ''; domCount.set(d, (domCount.get(d)||0)+1); });
  const top = [...domCount.entries()].sort((a,b)=>b[1]-a[1])[0];
  const topShare = top ? Math.round(top[1] / items.length * 100) : 0;

  return {dup, hypeN, hypeSamples, topDom: top ? top[0] : '', topShare};
}

/* ---------- 证据图谱：置信度 / 雷达 / 词云 / 层级分布 ---------- */
function computeConfidence(items){
  const n = items.length || 1;
  const avgW = items.reduce((a,i)=>a+(i.weight||0),0) / n;
  const sites = new Set(items.map(i=>i.site||i.url)).size;
  const high = items.filter(i=>['official','academic','media'].includes(i.tier)).length;
  const now = Date.now();
  let fresh = 0;
  items.forEach(it=>{
    const m = (it.date||'').match(/(\d{4})[-\/.](\d{1,2})/);
    if(m){
      const d = new Date(+m[1], +m[2]-1, 1).getTime();
      if((now - d) / 86400000 <= 730) fresh++;
    }
  });
  const dims = [
    {name:'信源权威', value: Math.round(avgW*100)},
    {name:'多源印证', value: Math.min(100, Math.round(sites*5))},
    {name:'时效性',   value: Math.round(fresh/n*100)},
    {name:'高可信占比', value: Math.round(high/n*100)},
    {name:'证据密度', value: Math.min(100, Math.round(n/30*100))}
  ];
  const overall = Math.round(dims.reduce((a,d)=>a+d.value,0)/dims.length);
  return {dims, overall};
}

function radarSvg(dims){
  const cx=110, cy=104, R=76, n=dims.length;
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let rings='';
  [0.25,0.5,0.75,1].forEach(k=>{
    rings += `<polygon points="${dims.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="#E5E1D8" stroke-width="1"/>`;
  });
  let axes='';
  dims.forEach((_,i)=>{ const [x,y]=pt(i,R); axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E5E1D8"/>`; });
  const pts = dims.map((d,i)=>pt(i, R*Math.max(0.06, d.value/100)).join(',')).join(' ');
  let labels='';
  dims.forEach((d,i)=>{
    const [x,y]=pt(i,R+15);
    labels += `<text x="${x}" y="${y}" text-anchor="middle" font-size="9" fill="#9CA3AF">${d.name}</text>`;
  });
  return `<svg viewBox="0 0 220 208" width="100%" height="200">${rings}${axes}
    <polygon points="${pts}" fill="rgba(15,118,110,.16)" stroke="#0F766E" stroke-width="2"/>${labels}</svg>`;
}

function cloudWords(items, entities){
  const freq = new Map(), colorOf = new Map();
  const bump=(w,c,color)=>{ freq.set(w,(freq.get(w)||0)+c); const cur=colorOf.get(w); if(!cur||cur.w<color){ colorOf.set(w,{w:color,c:color===0?'#9CA3AF':null, tier:null}); } };
  items.forEach(it=>{
    const t = it.passage||'';
    const col = SRC[it.tier].c, wv = SRC[it.tier].w;
    entities.forEach(e=>{
      let c=0, idx=0;
      while((idx=t.indexOf(e, idx)) !== -1){ c++; idx += e.length; }
      if(c>0){
        freq.set(e,(freq.get(e)||0)+c);
        const cur = colorOf.get(e);
        if(!cur || cur.w < wv) colorOf.set(e,{w:wv,c:col});
      }
    });
    S.kws.forEach(k=>{
      if(k.length<2) return;
      let c=0, idx=0;
      while((idx=t.indexOf(k, idx)) !== -1){ c++; idx += k.length; }
      if(c>0 && !freq.has(k)){ freq.set(k,c); if(!colorOf.has(k)) colorOf.set(k,{w:0.5,c:'#9CA3AF'}); }
    });
  });
  const arr=[...freq.entries()].filter(([w])=>w.length>=2).sort((a,b)=>b[1]-a[1]).slice(0,42);
  const max = arr.length ? arr[0][1] : 1;
  return arr.map(([text,f])=>({
    text, f,
    size: Math.round(11 + (f/max)*20),
    color: (colorOf.get(text)||{c:'#9CA3AF'}).c
  }));
}

function drawCloud(canvas, words){
  if(!canvas || !words.length) return;
  const W = canvas.clientWidth || 640, H = 210, dpr = window.devicePixelRatio || 1;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const placed = [];
  const overlap=(a,b)=> !(a.x+a.w < b.x || b.x+b.w < a.x || a.y+a.h < b.y || b.y+b.h < a.y);
  words.forEach(w=>{
    ctx.font = `700 ${w.size}px "PingFang SC","Microsoft YaHei",sans-serif`;
    const tw = ctx.measureText(w.text).width, th = w.size*1.3;
    let angle=0, radius=0, x=0, y=0, ok=false;
    for(let step=0; step<900; step++){
      x = W/2 + Math.cos(angle)*radius - tw/2;
      y = H/2 + Math.sin(angle)*radius - th/2;
      const box={x:x-2,y:y-2,w:tw+4,h:th+4};
      if(x>=2 && y>=2 && x+tw<=W-2 && y+th<=H-2 && !placed.some(p=>overlap(p,box))){ ok=true; placed.push(box); break; }
      angle += 0.33; radius += 0.62;
    }
    if(!ok) return;
    ctx.fillStyle = w.color;
    ctx.textBaseline='top';
    ctx.fillText(w.text, x, y);
  });
}

/* 交叉验证：统计每个术语被几个独立站点提到，并检测表述矛盾与数字冲突。
   纯规则，不需要 LLM。 */
function crossCheck(items, entities){
  const NEG = /(不支持|不具备|无法|不能|不会|不再|并非|没有|禁用|禁止|未|无|非)/;
  const info = new Map();
  entities.forEach(e=> info.set(e, {sites:new Set(), neg:0, pos:0, nums:new Set()}));

  items.forEach(it=>{
    const clean = (it.passage||'').replace(/\s+/g,' ');
    const arr = clean.split(/(?<=[。！？；])/).map(x=>x.trim()).filter(x=>x.length>10);
    arr.forEach(s=>{
      entities.forEach(e=>{
        if(!s.includes(e)) return;
        const v = info.get(e);
        v.sites.add(it.site || it.url || '');
        if(NEG.test(s)){ v.neg++; if(!v.negTxt) v.negTxt = s; }
        else { v.pos++; if(!v.posTxt) v.posTxt = s; }
        const nums = s.match(/\d+(?:\.\d+)?\s*(?:%|％|元|万元|亿元|吨|天|小时|分钟|个|条|台|套|年|月|日|℃|倍)/g);
        if(nums) nums.slice(0,4).forEach(n=> v.nums.add(n.replace(/\s/g,'')));
      });
    });
  });

  const rows = [];
  info.forEach((v, term)=>{
    rows.push({
      term,
      sites: v.sites.size,
      negConflict: v.neg > 0 && v.pos > 0,
      nums: [...v.nums],
      numConflict: v.nums.size >= 2,
      posTxt: v.posTxt || '',
      negTxt: v.negTxt || ''
    });
  });
  rows.sort((a,b)=> b.sites - a.sites);
  return rows;
}

function pickSentence(passage, ks){
  const clean=(passage||'').replace(/\s+/g,' ').trim();
  if(!clean) return {plain:'', html:''};
  const arr=clean.split(/(?<=[。！？；])/).map(x=>x.trim()).filter(x=>x.length>6);
  let best=arr[0]||clean.slice(0,220), bs=-1;
  for(const s of arr){
    const low = s.toLowerCase();
    let c=0; for(const k of ks) if(low.includes(k)) c++;
    if(c>bs){bs=c;best=s;}
  }
  if(best.length>240) best=best.slice(0,240)+'…';
  let html=esc(best);
  for(const k of ks){
    if(k.length>=2 && html.includes(k)) html=html.split(k).join('<mark>'+k+'</mark>');
  }
  return {plain:best, html};
}

async function probe(){
  try{ const r=await fetch('/api/health',{cache:'no-store'}); const j=await r.json(); return !!j.ok; }
  catch(e){ return false; }
}
async function searchOne(q, mode){
  const cnt = mode==='deep' ? '30' : '20';
  const sc = SCENES[S.scene] || SCENES.general;
  const ind = sc.industry ? `&industry=${sc.industry}` : '';

/* ---------- 主流程 ---------- */
async function run(){
  const raw=$('#q').value.trim();
  if(!raw){ $('#q').focus(); return; }
  const mode=S.mode;
  $('#go').disabled=true; $('#go').textContent='查证中…';

  // 公开此问题：只提交问题文本本身，不带查证结果/证据；失败不影响主流程
  if($('#pubTog') && $('#pubTog').checked){
    fetch('/api/pubq', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ q: raw }) })
      .then(()=>refreshPubQ()).catch(()=>{});
  }

  S.kws=kws(raw);
  S.items=[]; S.filter='all';
  $('#filters').innerHTML=''; $('#tierbar').innerHTML='';
  $('#evList').innerHTML='<div class="ev-empty">正在召回…</div>';
  $('#evCount').textContent='0 条';
  $('#evMode').textContent = mode==='deep' ? '深度研究' : '快速验证';

  $('#main').innerHTML=`
    <div class="progress on">
      <div class="ph">INVESTIGATION PIPELINE</div>
      <div id="progList"></div>
    </div>`;

  const core = coreQuery(raw);
  const subs = splitSubQuestions(raw);
  const variants = (mode==='deep'
    ? [raw, core, core+' 案例', core+' 原理', core+' 综述']
    : [raw, core]).concat(subs);

  const s1=stepEl(`问题改写：生成 ${variants.length} 条检索式`); await wait(260); stepDone(s1);
  const s2=stepEl(`并行召回 ${variants.length} 路`);

  let all=[], errs=[], notice='';
  if(S.connected){
    const jobs = variants.map(v=>searchOne(v,mode).catch(e=>({ok:false,error:String(e)})));
    if(S.bocha && S.bochaOk){
      jobs.push(fetch('/api/bocha?count=10&q='+encodeURIComponent(raw),{cache:'no-store'})
        .then(r=>r.json()).catch(e=>({ok:false,error:String(e)})));
    }
    const rs=await Promise.all(jobs);
    rs.forEach(r=>{
      if(r&&r.ok&&r.items){ all=all.concat(r.items); if(r.notice) notice=notice||r.notice; }
      else if(r&&r.error) errs.push(r.error);
    });
    stepDone(s2, `并行召回 ${jobs.length} 路 · 拿到 ${all.length} 条`);
  }else{
    stepDone(s2, '未连接代理');
  }

  if(!all.length){
    $('#main').innerHTML=`<div class="empty">没有拿到结果。<br><br>
      ${S.connected
        ? '本次检索没有返回内容，换个说法再试。'
        : '没连上元宝搜索代理。<br>在本目录运行 <b>py server.py</b>，然后打开 <b>http://127.0.0.1:8790/</b>'}
    </div>`;
    if(errs.length) $('#main').innerHTML += `<div style="font-size:12px;color:var(--red);text-align:center">${esc(errs[0])}</div>`;
    $('#go').disabled=false; $('#go').textContent='开始查证';
    return;
  }

  const s3=stepEl('去重与归一化'); await wait(200);
  const seen=new Set(), items=[];
  for(const it of all){ const k=(it.url||it.title||'').trim(); if(!k||seen.has(k))continue; seen.add(k); items.push(it); }
  decorate(items);
  items.sort((a,b)=>b.weight-a.weight);
  stepDone(s3, `去重后 ${items.length} 条`);

  const s4=stepEl('信源分级'); await wait(180);
  const high=items.filter(i=>['official','academic','media'].includes(i.tier));
  stepDone(s4, `高可信 ${high.length} / 低可信 ${items.length-high.length}`);

  const s5=stepEl('提取支撑片段并高亮'); await wait(200);
  items.forEach(it=>{ const p=pickSentence(it.passage,S.kws); it.snip=p.html; it.snipPlain=p.plain; });
  stepDone(s5, '已提取');

  S.items=items; S.lastRaw=raw; S.notice=notice;
  render(raw, items, mode, errs);
  $('#go').disabled=false; $('#go').textContent='开始查证';
  saveHistory(raw, mode, items.length);
}

function stepEl(name){
  const d=document.createElement('div');
  d.className='step run';
  d.innerHTML=`<span class="dot">·</span><span>${esc(name)}</span>`;
  const l=$('#progList'); if(l) l.appendChild(d);
  return d;
}
function stepDone(el, txt){
  el.className='step done';
  el.querySelector('.dot').textContent='✓';
  if(txt) el.querySelector('span:last-child').textContent=txt;
}

    </div>`:''}

    <div class="panel">
      <h3>本次查证<span class="r">${new Date().toLocaleString('zh-CN',{hour12:false})}</span></h3>
      <div style="font-size:13px;line-height:1.8;color:var(--ink2)">
        问题：<b style="color:var(--ink)">${esc(raw)}</b><br>
        召回 ${items.length} 条，高可信 ${high.length} 条，覆盖 ${sites} 个独立站点。<br>
        证据链与高亮片段见右侧；查不到时不会替你编答案。
      </div>
    </div>
  `;

  renderPipeline();
  renderFilters(items);
  renderEvidence(items);
  renderTierbar(items);
  requestAnimationFrame(()=>{ drawCloud(document.getElementById('cloud'), cloudWords(items, ans.entities)); });
  reportRep(items);
}

function renderPipeline(){
  const names=['问题改写','并行召回','去重归一','信源分级','提取片段'];
  const list=$('#progList');
  if(!list) return;
  list.innerHTML=names.map(n=>`<div class="step done"><span class="dot">✓</span><span>${n}</span></div>`).join('');
}

function renderFilters(items){
  const counts={all:items.length};
  ORDER.forEach(t=>counts[t]=items.filter(i=>i.tier===t).length);
  const shown=ORDER.filter(t=>counts[t]>0);
  $('#filters').innerHTML = `<button class="f on" data-f="all" onclick="setFilter('all')">全部 ${counts.all}</button>` +
    shown.map(t=>`<button class="f" data-f="${t}" onclick="setFilter('${t}')">${SRC[t].n} ${counts[t]}</button>`).join('');
}

function setFilter(f){
  S.filter=f;
  document.querySelectorAll('.f').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
  renderEvidence(S.items);
}

function renderEvidence(items){
  const list = S.filter==='all' ? items : items.filter(i=>i.tier===S.filter);
  $('#evCount').textContent = list.length + ' 条';
  if(!list.length){ $('#evList').innerHTML='<div class="ev-empty">没有符合条件的证据</div>'; return; }
  $('#evList').innerHTML = list.map(it=>{
    const key=encodeURIComponent(it.url||it.title);
    const high = ['official','academic','media'].includes(it.tier);
    const g = gateScore(it, S.items);
    const DN = {auth:'场景权威',fresh:'时效匹配',commercial:'内容纯净',corroborate:'佐证一致',independent:'来源独立'};
    return `<div class="src ${high?'high':''}" data-key="${key}">
      <div class="sh">
        <span class="tier ${it.tier}">${SRC[it.tier].n}</span>
        <span class="site">${esc(it.site||'')}</span>
        ${it.engine==='bocha'?'<span class="eng-badge">博查</span>':''}
        <span class="gate ${g.cls}">${g.verdict}</span>
        <span class="dt ${it.stale?'old':''}">${esc(it.ageLabel || (it.date||'').slice(0,16))}</span>
      </div>
      <div class="ttl">${esc(it.title||'（无标题）')}</div>
      ${(it.jevDirect != null)?`<div class="jev-row">
        <span class="jev-k">Jev</span>
        <span>直接回答 ${(it.jevDirect*100).toFixed(0)}%</span>
        <span>相关度 ${it.jevRel!=null?it.jevRel:'—'}</span>
      </div>`:''}
      <div class="snip">${it.snip || '（无正文摘要）'}</div>
      <details class="verdict-d"><summary>判决书 · 门控 ${g.gate.toFixed(3)}</summary>
        <div class="vd-dims">
          ${Object.keys(g.dims).map(k=>`<div class="vd-row"><span>${DN[k]}</span><i><b style="width:${Math.round(g.dims[k]*100)}%;background:${g.dims[k]>=0.6?'var(--teal)':g.dims[k]>=0.3?'var(--amber)':'var(--red)'}"></b></i><em>${g.dims[k].toFixed(2)}</em></div>`).join('')}
        </div>
        <div class="vd-note">${g.pass?'五个维度均达阈值，可进入答案。':'有维度低于 0.3 阈值，已降级/排除。'}</div>
      </details>
      <div class="sf">
        ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">打开原文 ↗</a>`:'<span class="site">无独立链接</span>'}
        <span class="w">w=${it.weight.toFixed(2)}</span>
      </div>
    </div>`;
  }).join('');
}

function renderTierbar(items){
  const counts={};
  items.forEach(i=>counts[i.tier]=(counts[i.tier]||0)+1);
  $('#tierbar').innerHTML = ORDER.filter(t=>counts[t]).map(t=>
    `<span class="tb"><i style="background:${SRC[t].c}"></i>${SRC[t].n} <b>${counts[t]}</b></span>`).join('');
}

function focusSource(key, el){
  document.querySelectorAll('.claim').forEach(c=>c.classList.remove('on'));
  if(el) el.classList.add('on');
  setFilter('all');
  const card = document.querySelector(`.src[data-key="${key}"]`);
  if(!card) return;
  card.scrollIntoView({behavior:'smooth', block:'center'});
  card.classList.add('flash');
  setTimeout(()=>card.classList.remove('flash'), 1600);
}

/* ---------- 历史 ---------- */
function saveHistory(q, mode, n){
  S.history.unshift({q, mode, n, t:Date.now()});
  S.history=S.history.slice(0,8);
  try{ localStorage.setItem('detective_hist', JSON.stringify(S.history)); }catch(e){}
  renderHistory();
}
function loadHistory(){
  try{ S.history=JSON.parse(localStorage.getItem('detective_hist')||'[]'); }catch(e){ S.history=[]; }
  renderHistory();
}
function renderHistory(){
  if(!S.history.length){ $('#histWrap').style.display='none'; return; }
  $('#histWrap').style.display='block';
  $('#histList').innerHTML=S.history.map((h,i)=>`
    <div class="hitem" onclick="reuse(${i})">
      <div class="q">${esc(h.q)}</div>
      <div class="m">${h.mode==='deep'?'深度':'快速'} · ${h.n} 条 · ${new Date(h.t).toLocaleString('zh-CN',{hour12:false})}</div>
    </div>`).join('');
}
function reuse(i){
  const h=S.history[i]; if(!h) return;
  $('#q').value=h.q; setMode(h.mode); run();
}
function clearHistory(){
  S.history=[];
  try{ localStorage.removeItem('detective_hist'); }catch(e){}
  renderHistory();
}

/* ---------- 其他人在问什么（公开提问墙，只存问题文本本身） ---------- */
function relTime(iso){
  const t = new Date(iso).getTime();
  if(!t) return '';
  const diff = Math.max(0, Date.now()-t);
  const m = Math.floor(diff/60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m+' 分钟前';
  const h = Math.floor(m/60);
  if(h < 24) return h+' 小时前';
  return Math.floor(h/24)+' 天前';
}
async function refreshPubQ(){
  try{
    const r = await fetch('/api/pubq?n=12', {cache:'no-store'});
    const data = await r.json();
    if(!data.ok) return;
    const panel = $('#pubqPanel');
    if(!data.items.length){
      panel.style.display='none';
      return;
    }
    panel.style.display='block';
    $('#pubqList').innerHTML = data.items.map((it,i)=>
      `<div class="pubq-item" onclick="reusePubQ(${i})">
        <div class="pq-t">${esc(it.q)}</div>
        <div class="pq-at">${relTime(it.at)}</div>
      </div>`).join('');
    S.pubq = data.items;
  }catch(e){ /* 列表加载失败不影响主流程 */ }
}
function reusePubQ(i){
  const it = S.pubq && S.pubq[i]; if(!it) return;
  $('#q').value = it.q; $('#q').focus();
}
if($('#pubqRefresh')) $('#pubqRefresh').onclick = refreshPubQ;

/* ---------- 工具 ---------- */
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function setMode(m){
  S.mode=m;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  $('#modeHint').textContent = m==='deep' ? '5 路召回 + 交叉比对，慢一点但更全' : '2 路召回，秒回';
}

/* ---------- 启动 ---------- */
$('#go').onclick=run;
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#bochaTog').onchange = (e)=>{
  S.bocha = e.target.checked;
  if(S.bocha && !S.bochaOk){ toast('博查搜索未配置'); }
  else if(S.bocha){ toast('已开启双引擎召回'); }
};
$('#sceneSel').onchange = (e)=>{
  S.scene = e.target.value;
  const sc = SCENES[S.scene];
  toast(`场景已切到「${sc.n}」${sc.industry?' · 垂域 '+sc.industry:''}${sc.wl.length?' · 白名单 '+sc.wl.length+' 个域名':''}${sc.bl.length?' · 排除 '+sc.bl.length+' 个':''}`);
};
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) run(); });

(async()=>{
  S.connected=await probe();
  if(S.connected){
    try{ const r = await fetch('/api/reputation',{cache:'no-store'}); const j = await r.json(); if(j.ok) S.rep = j.rep || {}; }catch(e){}
    try{
      const r = await fetch('/api/jev/health',{cache:'no-store'});
      const j = await r.json();
      S.jevConfigured = !!(j && j.configured);
      const b = document.getElementById('jevBtn');
      if(b) b.style.display = S.jevConfigured ? 'inline-block' : 'none';
    }catch(e){}
    try{
      const r = await fetch('/api/bocha?q=test&count=1',{cache:'no-store'});
      const j = await r.json();
      S.bochaOk = !!(j && j.ok);
      const t = document.getElementById('bochaTog');
      if(t && !S.bochaOk) t.disabled = true;
    }catch(e){}
  }
  const p=$('#status');
  if(S.connected){ p.className='pill ok'; $('#statusTxt').textContent='元宝搜索 · 已连接'; }
  else { p.className='pill bad'; $('#statusTxt').textContent='未连接 · 请运行 py server.py'; }
  loadHistory();
  refreshPubQ();
})();
</script>
